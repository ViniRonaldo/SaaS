version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: filasaude-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: filasaude
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: filasaude-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: filasaude-api
    restart: unless-stopped
    ports:
      - '3333:3333'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/filasaude?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: filasaude-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: filasaude-refresh-secret-change-in-production
      PORT: 3333
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: filasaude-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
